services:
  sensors:
    build: .
    privileged: true
    devices: 
      - "/dev/i2c-1:/dev/i2c-1"
    command: ['python', '-u', 'main.py']
    volumes:
      - ./air_sensor.py:/usr/src/app/air_sensor.py
      - ./light_sensor.py:/usr/src/app/light_sensor.py
      - ./main.py:/usr/src/app/main.py
    ports:
      - '8080:8080'