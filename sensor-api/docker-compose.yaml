services:
  sensors:
    build:
      context: .
      dockerfile: lgpio.Dockerfile
    privileged: true
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
    command: [ 'python', '-u', 'main.py' ]
    volumes:
      - .:/usr/src/app/
    ports:
      - '8080:8080'

  lcd:
    build:
      context: .
      dockerfile: lgpio.Dockerfile
    privileged: true
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
    command: [ 'python', '-u', 'lcd_display.py' ]
    volumes:
      - .:/usr/src/app/

  matrix:
    build:
      context: .
      dockerfile: lgpio.Dockerfile
    privileged: true
    devices:
      - "/dev/spidev0.1:/dev/spidev0.1"
    command: [ 'python', '-u', 'led_matrix.py' ]
    volumes:
      - .:/usr/src/app/
